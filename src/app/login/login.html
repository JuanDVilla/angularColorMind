<div class="records-outer-box">
  <fieldset class="form-container">
    <legend class="scores-legend">Login</legend>

    <form id="form-login" class="auth-form">
      <p class="error-message hidden" id="login-error" role="alert"></p>

      <div class="form-group">
        <label for="login-user">User:</label>
        <input type="text" id="login-user" name="user" placeholder="User identifier" required>
      </div>

      <div class="form-group">
        <label for="login-pass">Password:</label>
        <input type="password" id="login-pass" name="password" placeholder="Password" required>
      </div>

      <div class="form-actions">
        <button id="submit-login" class="btn-send-auth">Send</button>
      </div>
    </form>
  </fieldset>
</div>
