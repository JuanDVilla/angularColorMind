<div class="records-outer-box">
  <fieldset class="form-container">
    <legend class="scores-legend">Login</legend>

    <form id="form-login" class="auth-form">
      @if(errorMessage()) {
        <p class="error-message" id="login-error" role="alert">{{errorMessage()}}</p>
      }

      <div class="form-group">
        <label for="login-user">Usuario:</label>
        <input [(ngModel)]="username" type="text" id="login-user" name="user" placeholder="Usuario" required>
      </div>

      <div class="form-group">
        <label for="login-pass">Contraseña:</label>
        <input [(ngModel)]="password" type="password" id="login-pass" name="password" placeholder="Contraseña" required>
      </div>

      <div class="form-actions">
        <button (click) = login() id="submit-login" class="btn-send-auth">Send</button>
      </div>
    </form>
  </fieldset>
</div>
