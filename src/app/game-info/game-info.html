<div class="game-container" id="game-container">
  <div class="game-board">
    <div class="game-column">
      <h2 class="section-title">Intento Actual</h2>
      <div class="slots-container">
        @for (slot of slots(); track $index) {
          <span class="circle slot" [style.backgroundColor]="slot !== null ? COLORS[slot] : DEFAULT_COLOR"></span>
        }
      </div>
      <div class="actions-container">
        <button class="btn-action" id="btn-undo" (click)="undo()">Atras</button>
        <button class="btn-action" id="btn-clear" (click)="clear()">Limpiar</button>
        <button class="btn-action btn-send" id="btn-send" (click)="send()">Enviar</button>
      </div>
    </div>

    <div class="game-column">
      <h2 class="section-title">Colores diponibles</h2>
      <div class="colors-container" id="colors-container">
        @for (color of COLORS; track color; let i = $index) {
          <button class="circle" id={{color}} value={{i}} [style.backgroundColor]="color" (click)="selectColor(i)"></button>
        }
      </div>
    </div>
  </div>

  <div class="attempts-section">
    <h2 class="section-title">Intentos</h2>
    <div class="attempts-list" id="attempts-list">

    </div>
  </div>
</div>
