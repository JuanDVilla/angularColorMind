<section class="game-page">
  <header class="game-header">
    <p class="eyebrow display">Gran Premio</p>
    <h1 class="display">Pole Position Mind</h1>
  </header>

  @if (!started()) {
    <div class="panel start-panel">
      <div class="lights" aria-hidden="true">
        @for (l of [1, 2, 3, 4, 5]; track l) {
          <span></span>
        }
      </div>
      <p>Adivina el orden en que los carros arrancan en la parrilla.</p>
      <button (click)="start()" class="btn btn-primary" id="btn-start">Encender motores</button>
    </div>
  } @else {
    <app-game-info />
  }
</section>
