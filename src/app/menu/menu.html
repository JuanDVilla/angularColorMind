<header class="navbar">
  <nav class="nav-left">
    <a routerLink="home" routerLinkActive="active">Home</a>
    <a routerLink="game" routerLinkActive="active">Play</a>
    <a routerLink="records" routerLinkActive="active">Records</a>
  </nav>
  <nav class="nav-right">
    @if (logged()) {
      <span class="username">Bienvenido: {{ username() }}</span>
      <a href="#" (click)="$event.preventDefault(); logout()">Logout</a>
    } @else {
      <a routerLink="register" routerLinkActive="active">Register</a>
      <a routerLink="login" routerLinkActive="active">Login</a>
    }
  </nav>
</header>
