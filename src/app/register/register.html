<div class="records-outer-box">
  <fieldset class="form-container">
    <legend class="scores-legend">Registro</legend>

    <form id="form-register" class="auth-form" (ngSubmit)="register()">
      <div class="form-group">
        <label for="reg-user">User:</label>
        <input type="text" id="reg-user" [(ngModel)]="userName" name="user" placeholder="Nombre Usuario" required>
      </div>

      <div class="form-group">
        <label for="reg-email">Email:</label>
        <input type="email" id="reg-email" [(ngModel)]="email" name="email" placeholder="Email" required>
      </div>

      <div class="form-group">
        <label for="reg-pass">Password:</label>
        <input type="password" id="reg-pass" #passwordInput [(ngModel)]="password" name="password" placeholder="Password" required>
      </div>

      <div class="form-group">
        <label for="reg-repeat">Repeat password:</label>
        <input type="password" id="reg-repeat" [(ngModel)]="repeatPassword" name="repeat_password" placeholder="" required>
      </div>

      @if (errorMessage()) {
        <p class="error-message" role="alert">{{ errorMessage() }}</p>
      }

      @if (successMessage()) {
        <p class="success-message" role="status">
          {{ successMessage() }}
          <br>
          <a routerLink="/login">Ir al login</a>
        </p>
      }

      <div class="form-actions">
        <button type="submit" id="submit-register" class="btn-send-auth">Send</button>
      </div>
    </form>
  </fieldset>
</div>
