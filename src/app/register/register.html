<div class="records-outer-box">
  <fieldset class="form-container">
    <legend class="scores-legend">Registro</legend>

    <form id="form-register" class="auth-form" onsubmit="event.preventDefault();">
      <div class="form-group">
        <label for="reg-user">Api:</label>
        <input type="text" id="reg-user" name="user" placeholder="Api identifier" required>
      </div>

      <div class="form-group">
        <label for="reg-email">Email:</label>
        <input type="email" id="reg-email" name="email" placeholder="Email" required>
      </div>

      <div class="form-group">
        <label for="reg-pass">Password:</label>
        <input type="password" id="reg-pass" name="password" placeholder="Password" required>
      </div>

      <div class="form-group">
        <label for="reg-repeat">Repeat password:</label>
        <input type="password" id="reg-repeat" name="repeat_password" placeholder="" required>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-register" class="btn-send-auth">Send</button>
      </div>
    </form>
  </fieldset>
</div>
